# Builds the macOS disk images and parks them in a DRAFT release.
#
# ─── Read this before using anything it produces ──────────────────────────────
#
# Two of the problems this file used to list have since been fixed in the source,
# and the rest have not. Keep the two apart when reading a build from here.
#
# Addressed, but never confirmed on a Mac (there is no Mac to confirm them on):
#
#   * The title bar. electron/main.ts now uses 'hiddenInset' with an explicit
#     trafficLightPosition on darwin and drops titleBarOverlay (a Windows/Linux
#     feature), and App.tsx pads the header left so the title clears the
#     traffic-light buttons. The 13/11 offset is a considered guess, not a
#     measurement — if the buttons sit off-centre in the 36px strip, that constant
#     is what to nudge.
#   * The update check. updateCheck.ts no longer raises the automatic banner on
#     darwin, because published releases carry only the Windows .exe and the banner
#     would have sent a Mac user to it. A check the user presses the button for
#     still answers honestly.
#
# Still unknown or unfixed:
#
#   * Unsigned and un-notarized. A .dmg downloaded through a browser carries the
#     quarantine attribute, so on Apple Silicon this typically reports "the app is
#     damaged and can't be opened" rather than offering a way through. Removing it
#     by hand (`xattr -dr com.apple.quarantine`) is the usual workaround. This is a
#     much worse first run than the Windows SmartScreen click-through, and it is the
#     one problem here that cannot be fixed in source — it needs a paid Apple
#     Developer identity and a notarization step in this workflow.
#   * safeStorage against the macOS Keychain is untested.
#   * The Google OAuth loopback redirect is untested.
#
# ─── Why this is a separate file ──────────────────────────────────────────────
#
# release.yml stays Windows-only and tag-triggered. This one runs ONLY from the
# Actions tab ("Run workflow"), so a Mac build can never ride along with a public
# release by accident, and nothing here can alter what release.yml publishes.
#
# ─── Why a draft release ──────────────────────────────────────────────────────
#
# Draft releases are invisible to anyone without write access on the repo, and
# their assets are not publicly downloadable — so an untested build cannot reach
# course staff browsing the Releases page. A draft also does not create its tag
# until it is published, so `mac-v1.0.0` never appears alongside the real `v1.0.0`.
# Workflow artifacts would hide it just as well but expire after 90 days, which is
# wrong for something meant to sit and wait for a maintainer.
#
# Drafts are also skipped by /releases/latest, so this cannot trigger the update
# banner in anybody's copy of the app.

name: Release (macOS, draft)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matching release.yml: vite and electron-vite require ^20.19 || >=22.12.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same gates as the Windows release. Both are platform-independent, so this is
      # not retesting so much as refusing to build a draft from broken source.
      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build disk images
        # CSC_IDENTITY_AUTO_DISCOVERY=false because there is no signing certificate in
        # this repo. Left on, electron-builder hunts the runner's empty Keychain for an
        # identity and fails the build rather than producing an unsigned app.
        #
        # `--publish never` for the same reason as release.yml: electron-builder detects
        # CI and otherwise tries to publish on its own, after the build, without a token.
        run: npm run build -- --mac --publish never
        env:
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Rename disk images
        # package.json builds x64 and arm64, so two files come out. electron-builder
        # distinguishes them with an "-arm64" suffix and nothing on the Intel one, which
        # asks the reader to know that bare means Intel. Name both explicitly.
        #
        # The glob is expanded once, before any renaming, so this cannot reprocess its
        # own output.
        run: |
          ver="$(node -p "require('./package.json').version")"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          cd release
          for f in *.dmg; do
            case "$f" in
              *arm64*) arch="APPLE-SILICON" ;;
              *)       arch="INTEL" ;;
            esac
            mv -- "$f" "Canvas-Extractor-Tools-MAC-$arch-$ver.dmg"
          done
          ls -1 *.dmg

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="mac-v${APP_VERSION}"

          # Re-running this workflow for the same version would otherwise fail on an
          # existing draft. Only ever touches mac-v* tags, which nothing but this file
          # creates, and only ever a draft — `--draft` on create means there is no
          # published release under this name to lose.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true

          cat > mac-notes.md <<'NOTES'
          ## Draft build — for testing, not for course staff

          These disk images compile from the same source as the Windows release. The
          macOS-specific parts of the app have been written deliberately, but **they have
          not been confirmed on an actual Mac** — treat anything below as expected
          behaviour to check, not behaviour that is known to work.

          This release is a draft on purpose, so an unverified build cannot reach people
          browsing the Releases page.

          ### Getting past Gatekeeper — do this first

          The build is unsigned and un-notarized, so a `.dmg` downloaded through a browser
          is quarantined. On Apple Silicon that usually appears as **"the app is damaged
          and can't be opened"**, which is misleading — the app is fine, macOS is refusing
          it. After dragging the app to Applications:

          ```
          xattr -dr com.apple.quarantine "/Applications/Canvas Extractor Tools.app"
          ```

          This is the one problem that cannot be fixed in the source. Removing it for good
          needs a paid Apple Developer identity and a notarization step in the build.

          ### Worth checking, and reporting back on

          - **The title bar.** The window's traffic-light buttons should sit centred at the
            left of the app's blue header, with the title clear of them. If they look
            off-centre or overlap the text, say so — it is a single coordinate to adjust.
          - **Signing in to Google.** The OAuth sign-in opens your browser and returns to
            the app. Untested on macOS.
          - **Saving your Canvas token.** Stored via the macOS Keychain. If the token does
            not survive quitting and reopening the app, that is the thing that failed.

          The in-app update banner is switched off on macOS on purpose: published releases
          carry only the Windows installer, so a banner here could only have offered you a
          file that will not run.

          Two images are attached: `APPLE-SILICON` for M-series Macs, `INTEL` for older ones.
          NOTES

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "macOS build ${APP_VERSION} (untested draft)" \
            --notes-file mac-notes.md \
            --draft \
            release/*.dmg

          echo "Draft created: $tag"
