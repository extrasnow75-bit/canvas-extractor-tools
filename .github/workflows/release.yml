# Builds installers for Windows and macOS and attaches them to a GitHub Release.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# or from the Actions tab via "Run workflow", which builds and uploads the installers as
# workflow artifacts without publishing a release — useful for testing the pipeline itself.
#
# The Google client secret is not in the repo. It is injected here from the repository
# secret MAIN_VITE_GOOGLE_CLIENT_SECRET; electron-vite reads MAIN_VITE_* at build time and
# compiles it into the main-process bundle, never the renderer.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # Don't let a macOS failure throw away a finished Windows installer, or vice versa.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # vite and electron-vite require ^20.19 || >=22.12. Plain "20" resolves to the
          # latest 20.x, which clears that floor only just — 22 leaves room.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build installer
        # `--publish never` is essential: electron-builder detects CI and otherwise tries to
        # publish the artifacts itself, failing with "GitHub Personal Access Token is not set"
        # *after* the installer has already been built. Publishing is the release job's work.
        run: npm run build -- --publish never
        env:
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
          # Builds are unsigned. Without this, electron-builder hunts for a signing identity
          # on macOS and fails the job when it finds none.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.artifact }}
          # Only the installers themselves — release/ also holds the unpacked app directory,
          # which is hundreds of megabytes and of no use to anyone downloading a build.
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only publish for a tag push; a manual run stops after building, so the pipeline can be
    # exercised without creating a release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename installers
        # electron-builder names files after the arch it built for (…-arm64.dmg), which asks
        # the reader to know what arm64 means. The people installing this are course staff,
        # not developers, so the filename itself should say which machine it is for.
        # The glob is expanded once, before any renaming, so this cannot reprocess its output.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd artifacts
          for f in *; do
            case "$f" in
              *arm64*.dmg) mv -- "$f" "Canvas-Extractor-Tools-MAC-Apple-Silicon-$ver.dmg" ;;
              *.dmg)       mv -- "$f" "Canvas-Extractor-Tools-MAC-Intel-$ver.dmg" ;;
              *.exe)       mv -- "$f" "Canvas-Extractor-Tools-WINDOWS-$ver.exe" ;;
            esac
          done
          ls -1

      - name: Write release notes
        # Quoted heredoc so the markdown's backticks are not run as command substitution;
        # the version is substituted afterwards.
        #
        # The install steps deliberately describe the warning the reader will see on screen
        # ("Windows protected your PC") rather than its cause. The audience is course staff,
        # so "unsigned build" and "Gatekeeper" name nothing they can match to their display.
        run: |
          cat > notes.md <<'NOTES'
          ## Which file do I download?

          | If you have | Download this |
          | --- | --- |
          | **A Windows PC** | `Canvas-Extractor-Tools-WINDOWS-__VER__.exe` |
          | **A Mac from late 2020 or newer** (Apple silicon) | `Canvas-Extractor-Tools-MAC-Apple-Silicon-__VER__.dmg` |
          | **An older Intel Mac** | `Canvas-Extractor-Tools-MAC-Intel-__VER__.dmg` |

          Not sure which Mac you have? Click the  menu in the top-left corner and choose
          **About This Mac**. If you see **Chip: Apple M1** (or M2, M3, M4), take the Apple
          silicon file. If you see **Processor: Intel**, take the Intel one.

          Ignore the two "Source code" links at the bottom — GitHub adds those to every
          release automatically. They are not the app.

          ## Installing

          Both warnings below are normal and expected. They appear because this app was built
          in-house rather than distributed through the Microsoft or Apple stores — not because
          anything is wrong with it.

          **Windows** — download the `.exe` file and double-click it to install.

          The first time you run it, Windows will show a blue screen saying **"Windows
          protected your PC."** Click **More info**, then click **Run anyway**. You will only
          see this once.

          **macOS** — download the `.dmg` file and drag the app into your Applications folder.

          The first time you open it, macOS will say the app **"cannot be opened."** To get
          past this, go to **System Settings → Privacy & Security**, scroll to the bottom, and
          click **Open Anyway** next to Canvas Extractor Tools. You will only need to do this
          once.

          ---

          Your Canvas token and Google sign-in are stored in your operating system's keychain
          and never leave your computer.
          NOTES
          sed -i "s/__VER__/${GITHUB_REF_NAME#v}/g" notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphen in the tag means a pre-release under semver (v0.9.0-rc.1), so mark it as
          # one. Otherwise GitHub would present a release candidate as the current release and
          # point everybody at it.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Canvas Extractor Tools $GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            artifacts/*
