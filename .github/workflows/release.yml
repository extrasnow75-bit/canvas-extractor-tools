# Builds the Windows installer and attaches it to a GitHub Release.
#
# Windows only, deliberately. The macOS builds were produced by a matrix here for several
# releases and were never made to work — unsigned, never launched on a real Mac, Keychain
# storage and the OAuth loopback both untested. Shipping them meant offering course staff a
# download that fails, above the one that works. The `mac` target is still configured in
# package.json, so `npm run build` on a Mac still produces a .dmg; what changed is that CI
# no longer publishes one. Bringing it back means restoring the os matrix on the build job,
# adding release/*.dmg to the upload path and the rename step, and a Mac row in the notes.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Before tagging, rewrite RELEASE_NOTES.md as the "What's new in vX.Y.Z" list for that
# version; the release job refuses to publish if the file does not name the tag.
#
# or from the Actions tab via "Run workflow", which builds and uploads the installer as a
# workflow artifact without publishing a release — useful for testing the pipeline itself.
#
# The Google client secret is not in the repo. It is injected here from the repository
# secret MAIN_VITE_GOOGLE_CLIENT_SECRET; electron-vite reads MAIN_VITE_* at build time and
# compiles it into the main-process bundle, never the renderer.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # vite and electron-vite require ^20.19 || >=22.12. Plain "20" resolves to the
          # latest 20.x, which clears that floor only just — 22 leaves room.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Before the build, so a broken parser fails the release rather than shipping. These
      # cover the pure string functions that turn Canvas responses into documents, which is
      # where every defect found in this app so far has been.
      - name: Test
        run: npm test

      - name: Build installer
        # `--publish never` is essential: electron-builder detects CI and otherwise tries to
        # publish the artifacts itself, failing with "GitHub Personal Access Token is not set"
        # *after* the installer has already been built. Publishing is the release job's work.
        run: npm run build -- --publish never
        env:
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          # Only the installer itself — release/ also holds the unpacked app directory, which
          # is hundreds of megabytes and of no use to anyone downloading a build.
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only publish for a tag push; a manual run stops after building, so the pipeline can be
    # exercised without creating a release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      # Only for RELEASE_NOTES.md; the installer comes from the build job's artifact.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: RELEASE_NOTES.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Check the change list names this version
        # RELEASE_NOTES.md is the "What's new" section of the release page: a bulleted list
        # of what changed since the previous version, written for the people installing
        # the app. It is rewritten for every release, so a tag pushed without updating it
        # would publish the previous version's list under a new heading. Stop here instead;
        # the installer is already built and the tag can be re-pushed once the file is right.
        run: |
          if ! grep -q "What's new in $GITHUB_REF_NAME" RELEASE_NOTES.md; then
            echo "::error file=RELEASE_NOTES.md::RELEASE_NOTES.md must start with '## What's new in $GITHUB_REF_NAME' and list the changes since the previous release."
            exit 1
          fi

      - name: Rename installer
        # electron-builder names the file after the version and arch, which asks the reader to
        # know what that means. The people installing this are course staff, not developers,
        # so the filename itself should say which machine it is for. The glob is expanded once,
        # before any renaming, so this cannot reprocess its output.
        #
        # No numeric prefix any more: it existed only to keep the Windows installer at the top
        # of an Assets list that GitHub sorts by filename, above two Mac files. With one
        # installer there is nothing to sort.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd artifacts
          for f in *.exe; do
            mv -- "$f" "Canvas-Extractor-Tools-WINDOWS-$ver.exe"
          done
          ls -1

      - name: Write release notes
        # Quoted heredoc so the markdown's backticks are not run as command substitution;
        # the version is substituted afterwards.
        #
        # The install steps deliberately describe the warning the reader will see on screen
        # ("Windows protected your PC") rather than its cause. The audience is course staff,
        # so "unsigned build" and "SmartScreen" name nothing they can match to their display.
        #
        # The Mac line is here on purpose. Saying nothing about macOS would leave a Mac user
        # to conclude the download is broken; naming it as unsupported takes them straight to
        # asking for a Windows machine.
        #
        # The Help Center link is the Confluence shortlink, matching src/components/HelpCenter.tsx
        # — it survives the page being renamed or moved between spaces, which the long
        # /wiki/spaces/…/pages/… form does not, and these notes are published permanently.
        # Anyone can read the URL here; the article itself still requires a Boise State login.
        #
        # The change list comes from RELEASE_NOTES.md (checked above) and goes straight after
        # the download link: someone deciding whether to reinstall wants to know what they
        # would get before they read how to install it.
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          **[Download for Windows — Canvas-Extractor-Tools-WINDOWS-__VER__.exe](https://github.com/__REPO__/releases/download/v__VER__/Canvas-Extractor-Tools-WINDOWS-__VER__.exe)**

          This app is Windows-only. There is no Mac version — if you work on a Mac, contact
          the eCampus Center.

          The Assets section further down holds the same file. Ignore the two "Source code"
          links beside it — GitHub adds those to every release automatically. They are not
          the app.

          NOTES
          cat RELEASE_NOTES.md >> notes.md
          cat >> notes.md <<'NOTES'

          ## Installing

          Download the `.exe` file and double-click it to install.

          Windows will show a blue screen saying **"Windows protected your PC."** Click
          **More info**, then click **Run anyway**. It appears because this app was built
          in-house rather than distributed through the Microsoft Store — not because anything
          is wrong with it. You will see it again each time you install a new version.

          ## Already have an earlier version?

          **You do not need to uninstall it first.** Run this installer over the top of it —
          it finds the existing copy and replaces it. Your Canvas token and Google sign-in are
          kept, so there is nothing to set up again.

          Two things to get right:

          - **Close Canvas Extractor Tools before you run the installer**, or Windows reports
            that files are in use and the install fails.
          - **Accept the install folder the installer offers.** It lets you change it, and
            choosing a different one leaves two copies installed side by side with no way to
            tell which you are opening.

          ## Instructions and help

          Setting the app up, what each extraction produces, and what to do when something
          goes wrong are covered in the eCampus Help Center:

          **[Canvas Extractor Tools — Help Center article](https://boisestateecampus.atlassian.net/wiki/x/BIDV0)**

          Sign in with your Boise State account if prompted.

          ---

          Your Canvas token and Google sign-in are stored in your operating system's keychain
          and never leave your computer.
          NOTES
          # `|` as the delimiter for the repo, which contains slashes. The download URL is
          # assembled rather than looked up: GitHub serves release assets at a predictable
          # path, and the rename step above fixes the filename, so the two agree by
          # construction. v__VER__ reconstructs the tag, which holds for pre-release tags
          # too — v0.9.0-rc.1 yields a version of 0.9.0-rc.1.
          sed -i "s/__VER__/${GITHUB_REF_NAME#v}/g; s|__REPO__|${GITHUB_REPOSITORY}|g" notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphen in the tag means a pre-release under semver (v0.9.0-rc.1), so mark it as
          # one. Otherwise GitHub would present a release candidate as the current release and
          # point everybody at it.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Canvas Extractor Tools $GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            artifacts/*
