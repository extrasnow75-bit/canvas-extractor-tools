# Builds the Windows installer and attaches it to a GitHub Release.
#
# Windows only, deliberately. The macOS builds were produced by a matrix here for several
# releases and were never made to work — unsigned, never launched on a real Mac, Keychain
# storage and the OAuth loopback both untested. Shipping them meant offering course staff a
# download that fails, above the one that works. The `mac` target is still configured in
# package.json, so `npm run build` on a Mac still produces a .dmg; what changed is that CI
# no longer publishes one. Bringing it back means restoring the os matrix on the build job,
# adding release/*.dmg to the upload path and the rename step, and a Mac row in the notes.
#
# Triggered by pushing a version tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# or from the Actions tab via "Run workflow", which builds and uploads the installer as a
# workflow artifact without publishing a release — useful for testing the pipeline itself.
#
# The Google client secret is not in the repo. It is injected here from the repository
# secret MAIN_VITE_GOOGLE_CLIENT_SECRET; electron-vite reads MAIN_VITE_* at build time and
# compiles it into the main-process bundle, never the renderer.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # vite and electron-vite require ^20.19 || >=22.12. Plain "20" resolves to the
          # latest 20.x, which clears that floor only just — 22 leaves room.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build installer
        # `--publish never` is essential: electron-builder detects CI and otherwise tries to
        # publish the artifacts itself, failing with "GitHub Personal Access Token is not set"
        # *after* the installer has already been built. Publishing is the release job's work.
        run: npm run build -- --publish never
        env:
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-windows
          # Only the installer itself — release/ also holds the unpacked app directory, which
          # is hundreds of megabytes and of no use to anyone downloading a build.
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only publish for a tag push; a manual run stops after building, so the pipeline can be
    # exercised without creating a release.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Rename installer
        # electron-builder names the file after the version and arch, which asks the reader to
        # know what that means. The people installing this are course staff, not developers,
        # so the filename itself should say which machine it is for. The glob is expanded once,
        # before any renaming, so this cannot reprocess its output.
        #
        # No numeric prefix any more: it existed only to keep the Windows installer at the top
        # of an Assets list that GitHub sorts by filename, above two Mac files. With one
        # installer there is nothing to sort.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd artifacts
          for f in *.exe; do
            mv -- "$f" "Canvas-Extractor-Tools-WINDOWS-$ver.exe"
          done
          ls -1

      - name: Write release notes
        # Quoted heredoc so the markdown's backticks are not run as command substitution;
        # the version is substituted afterwards.
        #
        # The install steps deliberately describe the warning the reader will see on screen
        # ("Windows protected your PC") rather than its cause. The audience is course staff,
        # so "unsigned build" and "SmartScreen" name nothing they can match to their display.
        #
        # The Mac line is here on purpose. Saying nothing about macOS would leave a Mac user
        # to conclude the download is broken; naming it as unsupported takes them straight to
        # asking for a Windows machine.
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          **Windows PC** — `Canvas-Extractor-Tools-WINDOWS-__VER__.exe`

          This app is Windows-only. There is no Mac version — if you work on a Mac, contact
          the eCampus Center.

          Ignore the two "Source code" links at the bottom — GitHub adds those to every
          release automatically. They are not the app.

          ## Installing

          Download the `.exe` file and double-click it to install.

          The first time you run it, Windows will show a blue screen saying **"Windows
          protected your PC."** Click **More info**, then click **Run anyway**. You will only
          see this once. It appears because this app was built in-house rather than
          distributed through the Microsoft Store — not because anything is wrong with it.

          ---

          Your Canvas token and Google sign-in are stored in your operating system's keychain
          and never leave your computer.
          NOTES
          sed -i "s/__VER__/${GITHUB_REF_NAME#v}/g" notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A hyphen in the tag means a pre-release under semver (v0.9.0-rc.1), so mark it as
          # one. Otherwise GitHub would present a release candidate as the current release and
          # point everybody at it.
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Canvas Extractor Tools $GITHUB_REF_NAME" \
            --notes-file notes.md \
            $prerelease \
            artifacts/*
