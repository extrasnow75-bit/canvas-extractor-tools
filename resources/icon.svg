<!--
  Canvas Extractor Tools app icon.

  A white "LMS" wordmark over a download arrow, on a Boise State blue tile. The letters are
  drawn as geometry rather than text so the icon has no font dependency and rasterises
  identically everywhere: L and M are polygons, and S is two tangent arcs stroked with round
  caps, which keeps its weight equal to the flat-sided letters.

  Cap height is 22 units in a 64-unit tile with a 3.52 stroke. Three letters is the widest a
  square tile will take — at this cap height the wordmark spans 47.3 units, leaving 8.35 of
  margin either side, so it cannot grow without crowding the edges.

  This file is the design source of truth. The packaged Windows icon (icon.ico) is rasterised
  from these same shapes by make-icon.py — if you change the geometry here, re-run that script
  and keep its constants in sync.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 64 64">
  <title>Canvas Extractor Tools</title>

  <!-- Tile: Boise State blue -->
  <rect width="64" height="64" rx="11" fill="#0033A0"/>

  <!-- Wordmark: L and M as filled polygons -->
  <g fill="#fff">
    <path d="M8.35 9 H11.87 V27.48 H20.45 V31 H8.35 Z"/>

    <path d="M22.65 9 H26.17 V31 H22.65 Z"/>
    <path d="M37.17 9 H40.69 V31 H37.17 Z"/>
    <path d="M22.65 9 L26.17 9 L33.43 22.64 L29.91 22.64 Z"/>
    <path d="M37.17 9 L40.69 9 L33.43 22.64 L29.91 22.64 Z"/>
  </g>

  <!-- S: upper bowl counter-clockwise from its top-right terminal, lower bowl clockwise from
       the shared waist point at (49.27, 20) to its bottom-left terminal. -->
  <path d="M53.611 13.8 A4.62 4.62 0 1 0 49.27 20 A4.62 4.62 0 1 1 44.929 26.2"
        fill="none" stroke="#fff" stroke-width="3.52" stroke-linecap="round"/>

  <!-- Download arrow: solid shaft, solid head, and the bar it lands on -->
  <g fill="#fff">
    <rect x="29.6" y="38.5" width="4.8" height="8.2" rx="0.6"/>
    <path d="M25.2 45.6h13.6L32 53.4z"/>
    <rect x="23" y="55" width="18" height="3.4" rx="1.5"/>
  </g>
</svg>
